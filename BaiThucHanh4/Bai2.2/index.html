
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href="../../assets/css/flex.css">
    <link rel = "stylesheet" href="../../assets/css/style.css">
    <link rel = "stylesheet" href="../../assets/css/position.css">
    <link rel = "stylesheet" href="./assets/css/bai22.css">
</head>
<body>
    <style>
        input{
            outline: none;
        }
    </style>

    <form class="d-flex flex-column items-start">
        <label>Tên sản phẩm</label>
        <select name="tenSP">
            <option selected readonly>-- Chọn sản phẩm --</option>
            
        </select>

        <label>Số lượng</label>
        <input type="number" name="quantity">

        <label>Ngày giao hàng</label>
        <input type="date" name="ngayGiaoHang">

        <label>Địa chỉ giao</label>
        <input type="text" name="address">

        <label>Ghi chú</label>
        <div class="d-flex items-center">
            <span class="m-0" id = 'ghiChuLength'>0</span>
            <span>/200</span>
        </div>
        
        <textarea name="ghiChu"></textarea>

        <label>Phương thức thanh toán</label>
        <div class="d-flex items-center">
            <input type="radio" name="ptt" value="cod">
            <label>COD</label>
        </div>
        <div class="d-flex items-center">
            <input type="radio" name="ptt" value="chuyenKhoan">
            <label>Chuyển Khoản</label>
        </div>
        <div class="d-flex items-center">
            <input type="radio" name="ptt" value="viDienTu">
            <label>Ví Điện Tử</label>
        </div>

        <button type="submit">Gửi</button>
    </form>
    <div class="d-flex items-center">
        <span>Tổng tiền: </span>
        <span id = 'totalprice'> 0</span>đ
    </div>

    <div class="d-flex flex-column" id='form-xac-nhan'>

    </div>
    <script src="./assets/js/main.js"></script>
</body>
</html>
