<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../assets/flex.css">
    <link rel="stylesheet" href="../assets/position.css">
    <link rel="stylesheet" href="./bai5.css">
</head>

<body>

    <div class="container__fluid relative d-flex items-center" style="height: 100vh;">
        <div class="formAddEmployee bg-white">
            <div class="d-flex items-center justify-between bg-blue px-4 py-2">
                <h4 class="m-0 text-white">
                    New Employee
                </h4>
                <button class="bg-blue border-none">X</button>
            </div>

            <form class="container__fluid">
                <div class="rows">
                    <div class="col-6 d-flex flex-column items-start">
                        <label class="py-1">Name</label>
                        <input type="text" name="name" class="col-12 rounded" required>
                    </div>
                    <div class="col-6 d-flex flex-column items-start">
                        <label class="py-1">Email</label>
                        <input type="email" name="email" class="col-12 rounded" required>
                    </div>
                </div>
                <div class="rows">
                    <div class="col-6 d-flex flex-column items-start">
                        <label class="py-1">Phone</label>
                        <input type="text" name="phone" class="col-12 rounded" required maxlength="11" minlength="10">
                    </div>
                    <div class="col-6 d-flex flex-column items-start">
                        <label class="py-1">Position</label>
                        <select class="col-12 font-16 rounded" required>
                            <option readonly selected class="text-gray-200">--Select Position--</option>
                            <option value="staff">Staff</option>
                            <option value="manager">Manager</option>
                            <option value="ceo">CEO</option>
                        </select>
                    </div>
                </div>
                <div class="rows">
                    <div class="col-6 d-flex flex-column items-start">
                        <label class="py-1">Sex</label>
                        <div class="d-flex items-center gap-x-4">
                            <div>
                                <input type="radio" name="sex" value="male" class="m-0" required>
                                <label>Male</label>
                            </div>
                            <div>
                                <input type="radio" name="sex" value="female" required>
                                <label>Female</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="formButton col-12 d-flex items-center justify-end gap-x-3">
                    <button type="submit" class="text-white bg-green px-2 py-2 border-none rounded-sm">Save</button>
                    <button type="reset" class="text-white bg-gray px-2 py-2 border-none rounded-sm">Cancel</button>
                </div>
            </form>
        </div>

    </div>

</body>

</html>
