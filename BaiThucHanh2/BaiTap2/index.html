<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 2</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header class="container-fluid bg-transparent">
        <div class="container">
            <div class="d-flex items-center justify-between">
                <h3 class="m-0">TRAVEL GOALS</h3>

                <nav class="d-flex items-center gap-x-1">
                    <span class="font-bold">Destinations</span>
                    <span class="font-bold">About</span>
                </nav>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="d-flex items-center justify-center bg-main">

            <div class="main__card d-flex flex-column items-center gap-y-2">
                <h1 class="font-bold text-white m-0">JOE'S TRAVEL PAGE</h1>
                <p class="m-0 text-gray font-14">LET'S EXPLORE THE WORLD TOGETHER</p>
                <button class="font-bold bg-yellow px-2 py-2 border-none rounded">Discover places</button>
            </div>
        </div>

        <div class = "py-4">
            <h2 class="font-bold m-0 text-align-center">
                HIGHLIGHTS
            </h2>
            <div class="d-flex items-center gap-x-2">
                <div class="col-12 d-flex">
                    <div class = "col-4">
                        <div class="vienimg col-12 px-0 py-0">
                            <img class="main-img col-12 px-0 py-0"
                                src="https://www.worldatlas.com/r/w768/upload/34/b5/d7/shutterstock-449361664.jpg">
                        </div>
                        <p class = "m-0 text-gray text-align-center py-2">MIAMI USA</p>
                    </div>
                    <div class = "col-4">
                        <div class="vienimg col-12 px-0 py-0">
                            <img class="main-img col-12 px-0 py-0"
                                src="https://images.trvl-media.com/place/508534/3fd219ce-b6f4-4c8a-b862-cf0153fe5f12.jpg">
                        </div>
                        <p class = "m-0 text-gray text-align-center py-2">MUNICH GERMANY</p>
                    </div>
                    <div class = "col-4">
                        <div class="vienimg col-12 px-0 py-0">
                            <img class="main-img col-12 px-0 py-0"
                                src="https://d3dqioy2sca31t.cloudfront.net/Projects/cms/production/000/020/484/original/d0531471711b367b94abfd4dbc29e6ae/spain-barcelona-sagrada-familia-080416-az.jpg">
                        </div>
                        <p class = "m-0 text-gray text-align-center py-2">BARCELONA SPAIN</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class = "container-fluid bg-black py-2">
        <div class = "d-flex justify-center gap-x-2 text-white">
            <i class="fa-brands fa-instagram font-25"></i>
            <i class="fa-brands fa-facebook font-25"></i>
        </div>
    </footer>
</body>

</html>
