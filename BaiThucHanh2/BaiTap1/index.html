<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 1</title>

    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div class="container-fluid">
        <div class = "container d-flex flex-column gap-y-2">
            <p class = "m-0 font-bold">Get in touch with us by filling contact form below</p>

            <form action = "#" class = "d-flex flex-column gap-y-2">
                <div class = "d-flex items-center gap-x-2">
                    <input type = "text" name = "fullName" placeholder="*Enter your full name" required class = "col-6">
                    <input type = "email" name = "email" placeholder="*Enter your email" required class = "col-6">
                </div>

                <input type="text" name="subject" placeholder="Enter your subject" class = "col-12">

                <textarea placeholder="*Your message here.." required class="col-12 textarea"></textarea>

                <div class = "d-flex items-center justify-between col-12 px-0 py-0">
                    <button class = "text-white bg-blue rounded border-none px-2 py-2">
                        Send message
                    </button>
                    <span class = "text-gray">*Please fill all required form field,thanks</span>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
